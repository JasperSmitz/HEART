[package]
name = "heart"
version.workspace = true
edition.workspace = true
[dependencies]
heart-core = { path = "../core" }
heart-websearch = { path = "../../modules/websearch" }
dotenvy = "0.15"
heart-system = { path = "../../modules/system" }
heart-contract = { path = "../contract" }
serde_json.workspace = true
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
portable-pty = "=0.9.0"
tui-term = { version = "=0.3.4", default-features = false, features = ["vt100"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["fs", "signal", "process"] }
